# Этап 3 подготовки к финалу, модель контура: то же, что run1_seg_neg (снимки «нет опухоли» с пустой маской),
# единственное отличие — данные: + внешние срезы train с обводкой ядра опухоли (UPENN-GBM: метки 1 + 3;
# BraTS-MEN-RT: GTV) и срезы T1 с контрастом без опухоли тех же пациентов (пустая маска). Без прореживания.
# Эпоха — лучший Dice по срезам с опухолью нашего и внешнего val вместе. Seed 42, 43, 44.
_base_: base.yaml
run: run3_seg
kind: segmenter
data:
  table: poolx
train:
  epochs: 40
  epochs_frozen: 5
  seg_negatives:
    enabled: true
